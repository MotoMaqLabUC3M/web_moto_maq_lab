name: Update Instagram Feed

on:
  schedule:
    # Corre todos los días a las 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install instaloader requests

      - name: Fetch Instagram Posts
        run: python scripts/fetch_ig_feed.py

      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/ig_feed.json assets/img/ig_cache/
          # Solo hace commit si hay cambios
          git diff --staged --quiet || git commit -m "chore: auto-update instagram feed"
          git push
