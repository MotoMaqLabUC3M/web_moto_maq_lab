name: Update Instagram Feed

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install instaloader requests

      - name: Fetch Instagram Posts
        working-directory: apps/site
        run: python scripts/fetch_ig_feed.py

      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/site/assets/data/ig_feed.json apps/site/assets/img/ig_cache/
          git diff --staged --quiet || git commit -m "chore: auto-update instagram feed"
          git push
