name: Update Sitemap

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'assets/data/**'
      - 'scripts/generate_sitemap.py'
      - 'scripts/generate_detail_pages.py'
      - '.github/workflows/update-sitemap.yml'

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate sitemap and detail pages
        run: |
          python3 scripts/generate_sitemap.py
          python3 scripts/generate_detail_pages.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          ls evento-*.html 2>/dev/null | xargs -r git add || true
          ls noticia-*.html 2>/dev/null | xargs -r git add || true
          ls patrocinador-*.html 2>/dev/null | xargs -r git add || true
          git diff --cached --quiet || (git commit -m "chore: regenerar sitemap y páginas evento-/noticia-/patrocinador-" && git push)
