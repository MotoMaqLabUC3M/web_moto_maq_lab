# Sitio estático + API + panel admin en /admin (producción VPS)
# Un solo dominio: web pública en /, CMS en /admin, API en /api y /media

upstream motomaqlab_api {
    server api:8080;
}

upstream motomaqlab_admin {
    server admin:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # API (sitio público + panel admin)
    location /api/ {
        proxy_pass http://motomaqlab_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://motomaqlab_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://motomaqlab_api;
    }

    # Panel admin — no indexar (también noindex en HTML del panel)
    location = /admin {
        return 302 /admin/login;
    }

    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://motomaqlab_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Web pública estática
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
