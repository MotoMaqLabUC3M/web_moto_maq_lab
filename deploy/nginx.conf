# Sitio estático + API + panel admin en /admin (producción VPS)
# Un solo dominio: web pública en /, CMS en /admin, API en /api y /media

upstream motomaqlab_api {
    server api:8080;
}

upstream motomaqlab_admin {
    server admin:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # API (sitio público + panel admin)
    location /api/ {
        proxy_pass http://motomaqlab_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://motomaqlab_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://motomaqlab_api;
    }

    # Sitemap dinámico (páginas estáticas + artículos publicados del CMS)
    location = /sitemap.xml {
        proxy_pass http://motomaqlab_api/api/v1/public/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTML SEO de artículos CMS: title/canonical/OG en el primer byte (no solo JS)
    location ~ ^/noticia-(.+)\.html$ {
        try_files $uri @seo_article_es;
    }
    location @seo_article_es {
        rewrite ^/noticia-(.+)\.html$ /api/v1/public/seo/article/es/$1 last;
    }

    location ~ ^/news-(.+)\.html$ {
        try_files $uri @seo_article_en;
    }
    location @seo_article_en {
        rewrite ^/news-(.+)\.html$ /api/v1/public/seo/article/en/$1 last;
    }

    location ~ ^/api/v1/public/seo/article/ {
        proxy_pass http://motomaqlab_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 /404.html;
    }

    # Eventos: fichero generado o plantilla (indexable; JS rellena título/OG)
    location ~ ^/evento-.+\.html$ {
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter 'content="noindex, nofollow"' 'content="index, follow, max-image-preview:large"';
        try_files $uri /evento.html;
    }

    # Patrocinadores y Sponsors: fichero generado o plantilla (JS rellena contenido si falta fichero estático)
    location ~ ^/patrocinador-.+\.html$ {
        try_files $uri /patrocinador.html;
    }

    location ~ ^/sponsor-.+\.html$ {
        try_files $uri /sponsor.html;
    }

    # Panel admin — no indexar (también noindex en HTML del panel)
    location = /admin {
        return 302 /admin/login;
    }

    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://motomaqlab_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Web pública estática
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
