# Producción — VPS
# Uso: cd deploy && cp .env.example .env && docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motomaqlab}
      POSTGRES_USER: ${POSTGRES_USER:-motomaqlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-motomaqlab} -d ${POSTGRES_DB:-motomaqlab}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - motomaqlab

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DB_DRIVER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-motomaqlab}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-motomaqlab}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-72}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      UPLOAD_DIR: /data/uploads
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS required}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    volumes:
      - uploads_data:/data/uploads
    restart: unless-stopped
    networks:
      - motomaqlab

  admin:
    build:
      context: ../apps/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL required}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - motomaqlab

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - admin
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ../apps/site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - motomaqlab

volumes:
  postgres_data:
  uploads_data:

networks:
  motomaqlab:
    driver: bridge
