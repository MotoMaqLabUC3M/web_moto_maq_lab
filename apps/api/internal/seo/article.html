<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
    <meta charset="UTF-8" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://translate.googleapis.com https://fonts.googleapis.com https://www.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; frame-src 'self' https:; connect-src 'self' https:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title>
    <meta name="description" content="{{.Description}}">
    <link rel="canonical" href="{{.Canonical}}">
    {{if .AlternateES}}<link rel="alternate" hreflang="es" href="{{.AlternateES}}">{{end}}
    {{if .AlternateEN}}<link rel="alternate" hreflang="en" href="{{.AlternateEN}}">{{end}}
    <link rel="alternate" hreflang="x-default" href="{{.HreflangDefault}}">

    <meta property="og:type" content="article">
    <meta property="og:locale" content="{{.OGLocale}}">
    {{if .OGLocaleAlt}}<meta property="og:locale:alternate" content="{{.OGLocaleAlt}}">{{end}}
    <meta property="og:site_name" content="MOTO-MAQLAB-UC3M">
    <meta property="og:title" content="{{.Title}}">
    <meta property="og:description" content="{{.Description}}">
    <meta property="og:url" content="{{.Canonical}}">
    <meta property="og:image" content="{{.Image}}">
    <meta property="og:image:alt" content="{{.ImageAlt}}">
    {{if .Author}}<meta property="article:author" content="{{.Author}}">{{end}}
    {{if .DatePublished}}<meta property="article:published_time" content="{{.DatePublished}}">{{end}}
    {{if .DateModified}}<meta property="article:modified_time" content="{{.DateModified}}">{{end}}
    {{if .Category}}<meta property="article:section" content="{{.Category}}">{{end}}

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{.Title}}">
    <meta name="twitter:description" content="{{.Description}}">
    <meta name="twitter:image" content="{{.Image}}">
    <meta name="twitter:image:alt" content="{{.ImageAlt}}">
    {{if .Author}}<meta name="author" content="{{.Author}}">{{end}}

    <script type="application/ld+json">{{.JSONLD}}</script>
    <script type="application/ld+json">{{.BreadcrumbJSONLD}}</script>

    <link rel="stylesheet" href="/assets/css/global.css" />
    <script src="https://unpkg.com/lucide@1.7.0/dist/umd/lucide.min.js" integrity="sha384-CykfT8/c0napBs4OEPBYSNzMhNhJUvjNEulxWZVAK+p2D3vEfYGg9zyOd8bzqyNO" crossorigin="anonymous"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MMNY9WVPLY"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-MMNY9WVPLY');
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicon/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon/favicon-16x16.png">
    <link rel="manifest" href="/assets/img/favicon/manifest.json">
    <meta name="theme-color" content="#ffffff">
</head>
<body>
    <header id="main-header"></header>
    <main>
        <noscript>
            <article>
                <h1>{{.Headline}}</h1>
                {{if .Excerpt}}<p>{{.Excerpt}}</p>{{end}}
                {{range .BodyParagraphs}}<p>{{.}}</p>{{end}}
            </article>
        </noscript>
        <div id="noticia-detalle"></div>
    </main>
    <footer id="main-footer"></footer>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/mobileMenu.js"></script>
    <script src="/assets/js/detailRouteId.js"></script>
    <script src="/assets/js/seoPageMeta.js"></script>
    <script src="/assets/js/cms-api.js"></script>
    <script src="/assets/js/blogDetalle.js"></script>
    <div id="google_translate_element" class="d-none"></div>
    <script src="/assets/js/translate.js"></script>
    <script src="/assets/js/scrollReveal.js"></script>
</body>
</html>
