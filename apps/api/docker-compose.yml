# Atajo dev — preferir: cd deploy && docker compose -f docker-compose.dev.yml up
services:
  api:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      UPLOAD_DIR: /app/data/uploads
      PUBLIC_API_BASE_URL: http://localhost:8080
      DATABASE_URL: file:/app/data/motomaqlab.db?_pragma=foreign_keys(1)
    volumes:
      - api_data:/app/data
    restart: unless-stopped

volumes:
  api_data:
